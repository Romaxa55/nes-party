<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#12131a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312131a'/%3E%3Cpath d='M6 3h4v3h3v4h-3v3H6v-3H3V6h3z' fill='%236ea8ff'/%3E%3C/svg%3E"
    />
    <title>NES Party — join a game</title>
  </head>
  <body>
    <main id="app">
      <!-- Screen 1: enter code -->
      <section id="screen-join" class="screen">
        <h1>Join a game</h1>
        <p class="lede">
          Enter the room code from whoever hosts the game. The screen and
          gamepad appear right here — no game file needed.
        </p>

        <div class="join-form">
          <input
            id="code-input"
            class="code-input"
            type="text"
            inputmode="latin"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="5"
            placeholder="CODE"
          />
          <button id="connect" class="primary">Connect</button>
        </div>

        <p id="join-error" class="error" hidden></p>
        <p id="join-status" class="fineprint" hidden></p>
        <p class="fineprint"><a href="./">Home</a></p>
      </section>

      <!-- Screen 2: play -->
      <section id="screen-play" class="screen live" hidden>
        <div class="live-top">
          <div id="play-status" class="players">Connected</div>
          <button id="sound-btn" class="ghost small">Enable sound</button>
        </div>

        <video
          id="stream-video"
          class="nes-screen"
          autoplay
          playsinline
          muted
        ></video>

        <div id="pad" class="pad">
          <div class="dpad">
            <div class="cell" data-button="UP,LEFT"></div>
            <div class="cell key" data-button="UP">▲</div>
            <div class="cell" data-button="UP,RIGHT"></div>
            <div class="cell key" data-button="LEFT">◀</div>
            <div class="cell"></div>
            <div class="cell key" data-button="RIGHT">▶</div>
            <div class="cell" data-button="DOWN,LEFT"></div>
            <div class="cell key" data-button="DOWN">▼</div>
            <div class="cell" data-button="DOWN,RIGHT"></div>
          </div>
          <div class="face">
            <div class="sys">
              <div class="pill" data-button="SELECT">SELECT</div>
              <div class="pill" data-button="START">START</div>
            </div>
            <div class="ab">
              <div class="round" data-button="B">B</div>
              <div class="round" data-button="A">A</div>
            </div>
          </div>
        </div>

        <p class="fineprint">
          Keyboard works too: arrows or WASD, A — K or X, B — J or Z,
          Start — Enter, Select — Shift.
        </p>
      </section>
    </main>

    <script type="module" src="/src/join-page.ts"></script>
  </body>
</html>
