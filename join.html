<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#12131a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2312131a'/%3E%3Cpath d='M6 3h4v3h3v4h-3v3H6v-3H3V6h3z' fill='%236ea8ff'/%3E%3C/svg%3E"
    />
    <title>NES Party — join a game</title>
  </head>
  <body>
    <main id="app">
      <!-- Screen 1: enter code -->
      <section id="screen-join" class="screen">
        <h1>Join a game</h1>
        <p class="lede">
          Enter the room code from whoever hosts the game. The screen and
          gamepad appear right here — no game file needed.
        </p>

        <div class="join-form">
          <input
            id="code-input"
            class="code-input"
            type="text"
            inputmode="latin"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            maxlength="5"
            placeholder="CODE"
          />
          <button id="connect" class="primary">Connect</button>
        </div>

        <p id="join-error" class="error" hidden></p>
        <p id="join-status" class="fineprint" hidden></p>
        <p class="fineprint"><a href="./">Home</a></p>
      </section>

      <!-- Screen 2: play, full-viewport stage -->
      <section id="screen-play" class="screen" hidden>
        <div class="stage">
          <video
            id="stream-video"
            class="game-view"
            autoplay
            playsinline
            muted
          ></video>

          <div class="hud">
            <div class="hud-left">
              <span id="play-status" class="hud-muted">Connected</span>
            </div>
            <div class="hud-right">
              <button id="sound-btn" class="hud-btn">Sound: off</button>
              <button id="fs-btn" class="hud-btn" title="Fullscreen">⛶</button>
            </div>
          </div>

          <div id="pad" class="overlay-pad touch-only">
            <div id="stick-zone" class="stick-zone">
              <div id="stick-base" class="stick-base" hidden>
                <div id="stick-nub" class="stick-nub"></div>
              </div>
            </div>
            <div id="btn-zone" class="btn-zone">
              <div class="sys-row">
                <div class="pill" data-button="SELECT">SELECT</div>
                <div class="pill" data-button="START">START</div>
              </div>
              <div class="ab-row">
                <div class="round" data-button="B">B</div>
                <div class="round" data-button="A">A</div>
              </div>
            </div>
          </div>

          <div class="rotate-hint">Rotate your phone sideways</div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/join-page.ts"></script>
  </body>
</html>
